<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AR View</title>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
  <style>
    body { margin: 0; }
    model-viewer {
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>
<body>
  <model-viewer
    src="26_08_2026.glb"
    ios-src="26_08_2026.usdz"
    alt="3D model"
    ar
    ar-modes="webxr scene-viewer quick-look"
    camera-controls
    auto-rotate
    shadow-intensity="1">
    <button slot="ar-button" style="
      background-color: #fff;
      border-radius: 8px;
      border: none;
      padding: 12px 18px;
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      font-weight: bold;">
      View in your space
    </button>
  </model-viewer>
</body>
</html>
